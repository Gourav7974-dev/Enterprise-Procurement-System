spring.application.name=eps-backend
server.port=${PORT:8080}
spring.jackson.default-property-inclusion=always
eps.cors.allowed-origins=${EPS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
eps.demo.state-file=${EPS_DEMO_STATE_FILE:${EPS_DATA_DIR:./data}/eps-demo-state.json}
eps.demo.invoice-dir=${EPS_INVOICE_DIR:${EPS_DATA_DIR:./data}/invoices}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.mvc.async.request-timeout=-1
